<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEFENDER</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const C = document.getElementById('c');
const G = C.getContext('2d');
const VW = 800, VH = 520;
const WW = 4096;
C.width = VW; C.height = VH;

// ── Audio ─────────────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();
const MG = AC.createGain(); MG.gain.value = 0.35; MG.connect(AC.destination);
function resume() { if (AC.state === 'suspended') AC.resume(); }

function osc(freq, type, dur, vol, freqEnd) {
  resume();
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(MG);
  o.type = type; o.frequency.value = freq;
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.start(); o.stop(AC.currentTime + dur);
}
function nz(dur, vol) {
  resume();
  const len = Math.ceil(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = buf; s.connect(g); g.connect(MG);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  s.start(); s.stop(AC.currentTime + dur);
}
const SFX = {
  shoot:      () => osc(900,'square',0.07,0.2),
  explode:    () => { nz(0.22,0.3); osc(100,'sawtooth',0.22,0.25,35); },
  bigExplode: () => { nz(0.55,0.45); osc(70,'sawtooth',0.55,0.35,25); },
  abduct:     () => osc(250,'sine',0.45,0.18,550),
  rescue:     () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>osc(f,'sine',0.12,0.18),i*60)),
  die:        () => { nz(0.18,0.28); osc(280,'sawtooth',0.75,0.3,35); },
  smartbomb:  () => { nz(0.85,0.55); osc(130,'sawtooth',0.85,0.45,28); },
  wave:       () => [330,440,550,660,880].forEach((f,i)=>setTimeout(()=>osc(f,'square',0.14,0.22),i*80)),
  thrust:     () => osc(35+Math.random()*15,'sawtooth',0.09,0.04),
};

// ── Helpers ───────────────────────────────────────────────────
function clamp(v,lo,hi) { return v<lo?lo:v>hi?hi:v; }
function rnd(n) { return Math.random()*n; }
function ri(n) { return Math.floor(Math.random()*n); }
function wrapX(x) { return ((x%WW)+WW)%WW; }
function wrapDist(a,b) { let d=b-a; if(d>WW/2)d-=WW; if(d<-WW/2)d+=WW; return d; }
function sxOf(wx) {
  const s = ((wx-camX)%WW+WW)%WW;
  return s > VW+120 ? s-WW : s;
}
function drawAt(wx,wy,fn) {
  const s = ((wx-camX)%WW+WW)%WW;
  if (s <= VW+60) fn(s, wy);
  if (s >= WW-60) fn(s-WW, wy);
}

// ── Terrain ───────────────────────────────────────────────────
const TSEG = 32;
let terrain = [];
function genTerrain() {
  terrain = []; let y = VH-90;
  for (let x=0; x<=WW; x+=TSEG) {
    y += (Math.random()-0.5)*55;
    y = clamp(y, VH-185, VH-48);
    terrain.push([x,y]);
  }
  terrain[terrain.length-1][1] = terrain[0][1];
}
function tY(wx) {
  wx = ((wx%WW)+WW)%WW;
  const i = clamp(Math.floor(wx/TSEG), 0, terrain.length-2);
  const t = (wx - terrain[i][0]) / TSEG;
  return terrain[i][1] + (terrain[i+1][1]-terrain[i][1])*t;
}

// ── Stars ─────────────────────────────────────────────────────
const STARS = Array.from({length:230}, ()=>({ x:rnd(WW), y:rnd(VH-80), b:Math.random(), layer:ri(3) }));
const PAR = [0.12, 0.38, 0.68];

// ── State ─────────────────────────────────────────────────────
let phase='title', score=0, lives=3, wave=1, bombs=3;
let camX=0, shootCD=0, thrustT=0, waveT=0, dyingT=0, frame=0;
const player = { x:800, y:260, vx:0, vy:0, facing:1 };
let bullets=[], ebullets=[], enemies=[], humans=[], parts=[];

const keys={}, jp=new Set();
document.addEventListener('keydown', e => { if(!keys[e.code])jp.add(e.code); keys[e.code]=true; e.preventDefault(); });
document.addEventListener('keyup',   e => { delete keys[e.code]; });

// ── Init ──────────────────────────────────────────────────────
function initGame() {
  score=0; lives=3; wave=1; bombs=3;
  genTerrain();
  player.x=800; player.y=260; player.vx=0; player.vy=0; player.facing=1;
  camX = wrapX(player.x - VW/2);
  bullets=[]; ebullets=[]; enemies=[]; humans=[]; parts=[];
  spawnWave();
  SFX.wave(); waveT=150;
  phase='playing';
}

function spawnWave() {
  humans=[];
  for (let i=0; i<10; i++) {
    const wx = 300+rnd(WW-600);
    humans.push({ x:wx, y:tY(wx)-10, alive:true, carried:false, carrier:null, vy:0 });
  }
  const nl = clamp(4+wave*2, 0, 20);
  const nb = clamp(wave-1, 0, 7);
  const np = clamp(wave-2, 0, 5);
  for (let i=0;i<nl;i++) mkEnemy('lander');
  for (let i=0;i<nb;i++) mkEnemy('bomber');
  for (let i=0;i<np;i++) mkEnemy('pod');
}

function mkEnemy(type, x, y) {
  x = x ?? rnd(WW);
  y = y ?? (90 + rnd(VH/2-90));
  const e = { type, x, y, hp:1, w:16, h:14 };
  if (type==='lander') Object.assign(e,{ vx:(Math.random()<.5?-1:1)*rnd(1.5), vy:0, state:'roam', target:null, sT:rnd(120) });
  if (type==='mutant') Object.assign(e,{ vx:0, vy:0, sT:rnd(50), w:16, h:16 });
  if (type==='bomber') Object.assign(e,{ vx:(Math.random()<.5?-1:1)*(1.2+rnd(1)), vy:0, bT:60+rnd(110), w:18, h:10 });
  if (type==='pod')    Object.assign(e,{ vx:(Math.random()<.5?-1:1)*rnd(1.2), vy:0, w:14, h:14 });
  if (type==='swarmer') Object.assign(e,{ w:10, h:10 });
  enemies.push(e); return e;
}

function scoreFor(t) { return {lander:150,mutant:150,bomber:250,pod:1000,swarmer:150}[t]||100; }

// ── Update ────────────────────────────────────────────────────
function update() {
  frame++;
  const pressed = new Set(jp); jp.clear();

  if (phase==='title'||phase==='gameover') {
    if (pressed.has('Space')) initGame();
    return;
  }
  if (phase==='dying') {
    if (--dyingT<=0) {
      if (lives<=0) { phase='gameover'; return; }
      player.x=wrapX(camX+VW/2); player.y=260;
      player.vx=0; player.vy=0;
      phase='playing';
    }
    upParts(); return;
  }

  // Player
  const ACC=0.5, MXV=7, DRG=0.87;
  let thrust=false;
  if (keys['ArrowLeft'] ||keys['KeyA']) { player.vx-=ACC; player.facing=-1; thrust=true; }
  if (keys['ArrowRight']||keys['KeyD']) { player.vx+=ACC; player.facing= 1; thrust=true; }
  if (keys['ArrowUp']   ||keys['KeyW']) { player.vy-=ACC; thrust=true; }
  if (keys['ArrowDown'] ||keys['KeyS']) { player.vy+=ACC; thrust=true; }
  player.vx = clamp(player.vx*DRG, -MXV, MXV);
  player.vy = clamp(player.vy*DRG, -MXV, MXV);
  player.x = wrapX(player.x + player.vx);
  player.y = clamp(player.y + player.vy, 80, VH-55);
  if (thrust && --thrustT<=0) { SFX.thrust(); thrustT=10; }
  camX = wrapX(player.x - VW/2);

  // Shoot
  shootCD = Math.max(0, shootCD-1);
  if ((keys['KeyZ']||keys['Space']||keys['ShiftLeft']) && shootCD===0) {
    SFX.shoot();
    bullets.push({ x:player.x+player.facing*15, y:player.y, vx:player.facing*13, vy:player.vy*0.25, life:55 });
    shootCD=8;
  }
  if (pressed.has('KeyX')||pressed.has('ControlLeft')||pressed.has('ControlRight')) smartBomb();

  // Bullets
  bullets  = bullets.filter(b=>{ b.x=wrapX(b.x+b.vx); b.y+=b.vy; return --b.life>0 && b.y>75 && b.y<VH-35; });
  ebullets = ebullets.filter(b=>{ b.x=wrapX(b.x+b.vx); b.y+=b.vy; return --b.life>0 && b.y>75 && b.y<VH; });

  upEnemies();
  upHumans();
  hitCheck();

  if (enemies.length===0) {
    wave++; bombs=Math.min(bombs+1,6);
    genTerrain();
    humans.forEach(h=>{ if(h.alive){h.y=tY(h.x)-10;h.vy=0;} });
    spawnWave(); SFX.wave(); waveT=150;
  }
  upParts();
}

function upEnemies() {
  const alive = humans.filter(h=>h.alive&&!h.carried);
  for (const e of enemies) {
    if (e.type==='lander') {
      if (e.state==='roam') {
        e.x = wrapX(e.x + e.vx);
        e.y += Math.sin(frame*0.03+e.x*0.005)*0.6;
        e.y = clamp(e.y, 90, VH/2);
        if (!e.target && alive.length>0 && Math.random()<0.003) { e.target=alive[ri(alive.length)]; e.state='descend'; }
        if (--e.sT<=0) {
          e.sT = 80+rnd(80);
          const dx = wrapDist(e.x, player.x);
          ebullets.push({ x:e.x, y:e.y, vx:Math.sign(dx)*4, vy:0.4, life:90 });
        }
      } else if (e.state==='descend') {
        if (!e.target||!e.target.alive||e.target.carried) { e.target=null; e.state='roam'; continue; }
        const dx=e.target.x-e.x, dy=(e.target.y-10)-e.y;
        const d=Math.sqrt(dx*dx+dy*dy)||1;
        if (d<5) { e.state='ascend'; e.target.carried=true; e.target.carrier=e; SFX.abduct(); }
        else { e.x=wrapX(e.x+(dx/d)*2.2); e.y+=(dy/d)*2.2; }
      } else if (e.state==='ascend') {
        e.y -= 1.9;
        if (e.target) { e.target.x=e.x; e.target.y=e.y+16; }
        if (e.y < 85) {
          if (e.target) { e.target.alive=false; e.target.carried=false; e.target.carrier=null; }
          Object.assign(e,{ type:'mutant', state:null, target:null, vx:0, vy:0, sT:rnd(50), w:16, h:16 });
        }
      }
    } else if (e.type==='mutant') {
      const dx=wrapDist(e.x,player.x), dy=player.y-e.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      e.x=wrapX(e.x+(dx/d)*3.5); e.y+=(dy/d)*3.5;
      if (--e.sT<=0) { e.sT=32+rnd(32); ebullets.push({x:e.x,y:e.y,vx:(dx/d)*5,vy:(dy/d)*5,life:55}); }
    } else if (e.type==='bomber') {
      e.x=wrapX(e.x+e.vx);
      e.y+=Math.sin(frame*0.02+e.x*0.004)*0.4;
      e.y=clamp(e.y,95,VH/2+50);
      if (--e.bT<=0) { e.bT=70+rnd(100); ebullets.push({x:e.x,y:e.y,vx:0,vy:3.8,life:115}); }
    } else if (e.type==='pod') {
      e.x=wrapX(e.x+e.vx);
      e.y+=Math.sin(frame*0.025+e.x*0.006)*0.5;
      e.y=clamp(e.y,95,VH/2+30);
    } else if (e.type==='swarmer') {
      const dx=wrapDist(e.x,player.x), dy=player.y-e.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      e.x=wrapX(e.x+(dx/d)*3); e.y+=(dy/d)*3;
    }
  }
}

function upHumans() {
  for (const h of humans) {
    if (!h.alive||h.carried) continue;
    if (!h.vy) continue;
    h.y += h.vy;
    const ty = tY(h.x)-10;
    const pdx=Math.abs(wrapDist(player.x,h.x)), pdy=Math.abs(player.y-h.y);
    if (pdx<22&&pdy<20&&h.vy>0) { h.y=ty; h.vy=0; score+=500; SFX.rescue(); continue; }
    if (h.y>=ty) { if(h.vy>8){h.alive=false;boom(h.x,h.y,5);}else{h.y=ty;h.vy=0;} }
  }
}

function hitCheck() {
  const db=new Set(), de=new Set();
  for (let bi=0;bi<bullets.length;bi++) {
    const b=bullets[bi];
    for (let ei=0;ei<enemies.length;ei++) {
      if (de.has(ei)) continue;
      const e=enemies[ei];
      if (Math.abs(wrapDist(b.x,e.x))<e.w/2+4 && Math.abs(b.y-e.y)<e.h/2+4) {
        db.add(bi); e.hp--;
        if (e.hp<=0) {
          de.add(ei); score+=scoreFor(e.type);
          boom(e.x,e.y,e.type==='pod'?8:12); SFX.explode();
          if (e.type==='pod') {
            for (let s=0;s<4;s++) { const a=s*Math.PI/2+Math.PI/4; mkEnemy('swarmer',e.x+Math.cos(a)*22,e.y+Math.sin(a)*22); }
          }
          if (e.type==='lander'&&e.state==='ascend'&&e.target) { e.target.carried=false;e.target.carrier=null;e.target.vy=2.5; }
        }
        break;
      }
    }
  }
  bullets  = bullets.filter((_,i)=>!db.has(i));
  enemies  = enemies.filter((_,i)=>!de.has(i));

  if (phase!=='playing') return;
  const phit = ebullets.some(b=>Math.abs(wrapDist(b.x,player.x))<13&&Math.abs(b.y-player.y)<9);
  const chit = enemies.some(e=>Math.abs(wrapDist(e.x,player.x))<e.w/2+8&&Math.abs(e.y-player.y)<e.h/2+6);
  if (phit||chit) killPlayer();
}

function killPlayer() {
  lives--; phase='dying'; dyingT=100;
  SFX.die(); SFX.bigExplode(); boom(player.x,player.y,30);
  ebullets=[];
}

function smartBomb() {
  if (phase!=='playing'||bombs<=0) return;
  bombs--; SFX.smartbomb();
  for (const e of enemies) {
    score+=scoreFor(e.type); boom(e.x,e.y,14);
    if (e.type==='lander'&&e.state==='ascend'&&e.target) { e.target.carried=false;e.target.carrier=null;e.target.vy=2.5; }
  }
  enemies=[]; ebullets=[];
  parts.push({type:'flash',t:22,max:22});
}

// ── Particles ─────────────────────────────────────────────────
const PCOL = ['#ff4','#f80','#f44','#fff','#fa0'];
function boom(wx,wy,n) {
  for (let i=0;i<n;i++) {
    const a=rnd(Math.PI*2), sp=1+rnd(4), life=20+rnd(30);
    parts.push({type:'spark',x:wx,y:wy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life,max:life,col:PCOL[ri(PCOL.length)]});
  }
}
function upParts() {
  parts = parts.filter(p=>{
    if (p.type==='flash') return --p.t>0;
    p.x=wrapX(p.x+p.vx); p.y+=p.vy; p.vx*=0.92; p.vy*=0.92;
    return --p.life>0;
  });
}

// ── Draw ──────────────────────────────────────────────────────
function draw() {
  G.fillStyle='#000818'; G.fillRect(0,0,VW,VH);

  // Flash
  const fl = parts.find(p=>p.type==='flash');
  if (fl) { G.fillStyle=`rgba(255,255,255,${(fl.t/fl.max)*0.65})`; G.fillRect(0,0,VW,VH); }

  // Stars
  for (const s of STARS) {
    const sx = ((s.x - camX*PAR[s.layer])%WW+WW)%WW;
    if (sx>VW) continue;
    G.fillStyle = s.b>.88 ? `hsl(${200+s.b*60},60%,${55+s.b*45}%)` : `rgba(255,255,255,${0.2+s.b*0.8})`;
    G.fillRect(sx, s.y, s.layer===2?2:1, s.layer===2?2:1);
  }

  drawTerrain();

  // Humans
  for (const h of humans) {
    if (!h.alive) continue;
    drawAt(h.x, h.y, (sx,sy)=>drawHuman(sx,sy));
  }

  // Enemies
  for (const e of enemies) drawAt(e.x, e.y, (sx,sy)=>drawEnemy(e,sx,sy));

  // Player bullets
  for (const b of bullets) drawAt(b.x, b.y, (sx,sy)=>{ G.fillStyle='#0ff'; G.fillRect(sx-4,sy-1,8,3); });

  // Enemy bullets
  for (const b of ebullets) drawAt(b.x, b.y, (sx,sy)=>{
    G.fillStyle = b.vy>2.5&&!b.vx ? '#f0f' : '#f88';
    G.fillRect(sx-2,sy-2,5,5);
  });

  // Player
  if (phase!=='dying') drawPlayer();

  // Particles
  G.save();
  for (const p of parts) {
    if (p.type==='flash') continue;
    const sx=sxOf(p.x);
    if (sx<-5||sx>VW+5) continue;
    G.globalAlpha = p.life/p.max;
    G.fillStyle=p.col; G.fillRect(sx-1,p.y-1,3,3);
  }
  G.globalAlpha=1; G.restore();

  drawHUD();
  drawScanner();

  if (waveT>0) {
    waveT--;
    G.globalAlpha=Math.min(1,waveT/30);
    G.fillStyle='#ffe135'; G.font='bold 30px monospace'; G.textAlign='center';
    G.fillText(`WAVE ${wave}`, VW/2, VH/2-5);
    G.globalAlpha=1;
  }

  if (phase==='title')    drawTitle();
  if (phase==='gameover') drawGameOver();
}

function drawTerrain() {
  // Fill
  G.fillStyle='#14532d';
  G.beginPath();
  let first=true;
  for (const [tx,ty] of terrain) {
    const sx = sxOf(tx);
    if (first) { G.moveTo(sx,ty); first=false; } else G.lineTo(sx,ty);
  }
  G.lineTo(sxOf(WW), VH); G.lineTo(sxOf(0), VH); G.closePath(); G.fill();
  // Also draw a wrapped copy for seamless scrolling
  G.beginPath(); first=true;
  for (const [tx,ty] of terrain) {
    const sx = sxOf(tx+WW);
    if (first) { G.moveTo(sx,ty); first=false; } else G.lineTo(sx,ty);
  }
  G.lineTo(sxOf(WW*2),VH); G.lineTo(sxOf(WW),VH); G.closePath(); G.fill();
  // Highlight edge
  G.strokeStyle='#22c55e'; G.lineWidth=2;
  G.beginPath(); first=true;
  for (const [tx,ty] of terrain) {
    const sx=sxOf(tx); if(first){G.moveTo(sx,ty);first=false;}else G.lineTo(sx,ty);
  }
  G.stroke();
  G.beginPath(); first=true;
  for (const [tx,ty] of terrain) {
    const sx=sxOf(tx+WW); if(first){G.moveTo(sx,ty);first=false;}else G.lineTo(sx,ty);
  }
  G.stroke();
}

function drawHuman(sx,sy) {
  const wav = Math.sin(frame*0.08+sx)*2;
  G.fillStyle='#4ade80';
  G.fillRect(sx-2, sy-14, 4, 5);   // head
  G.fillRect(sx-3, sy-9,  6, 6);   // body
  G.fillRect(sx-3, sy-3,  2, 5);   // leg L
  G.fillRect(sx+1, sy-3,  2, 5);   // leg R
  G.fillRect(sx-6, sy-8+wav, 3, 2);// arm L
  G.fillRect(sx+3, sy-8-wav, 3, 2);// arm R
}

function drawEnemy(e,sx,sy) {
  G.save(); G.translate(sx,sy);
  if (e.type==='lander') {
    G.fillStyle='#dc2626'; G.fillRect(-8,-7,16,14);
    G.fillStyle='#ef4444'; G.fillRect(-4,-5, 8,10);
    G.fillStyle='#dc2626'; G.fillRect(-9,5,3,6); G.fillRect(6,5,3,6);
    G.fillStyle='#fde047'; G.fillRect(-3,-3,6,5);
    G.fillStyle='#000';    G.fillRect(-2,-2,4,3);
    if (e.state==='ascend'||e.state==='descend') {
      G.fillStyle=`hsl(${frame*8%360},100%,70%)`;
      G.fillRect(-10,-10,4,4); G.fillRect(6,-10,4,4);
    }
  } else if (e.type==='mutant') {
    G.fillStyle='#a855f7'; G.fillRect(-8,-8,16,16);
    G.fillStyle='#d8b4fe'; G.fillRect(-5,-5,10,10);
    G.fillStyle='#a855f7'; G.fillRect(-10,-2,2,4); G.fillRect(8,-2,2,4);
    G.fillRect(-2,-10,4,2); G.fillRect(-2,8,4,2);
    G.fillStyle='#fde047'; G.fillRect(-3,-3,6,6);
    G.fillStyle='#000';    G.fillRect(-1,-1,2,2);
  } else if (e.type==='bomber') {
    G.fillStyle='#f97316'; G.fillRect(-9,-5,18,10);
    G.fillStyle='#fed7aa'; G.fillRect(-6,-3,12,6);
    G.fillStyle='#9a3412'; G.fillRect(-3,4,6,5);
    G.fillStyle='#f97316'; G.fillRect(-11,-1,2,2); G.fillRect(9,-1,2,2);
  } else if (e.type==='pod') {
    const p=Math.sin(frame*0.06)*2;
    G.fillStyle='#06b6d4'; G.fillRect(-7-p,-7-p,14+p*2,14+p*2);
    G.fillStyle='#67e8f9'; G.fillRect(-4,-4,8,8);
    G.fillStyle='#fff';    G.fillRect(-1,-1,2,2);
    G.fillStyle='#06b6d4';
    G.fillRect(-10,-1,3,2); G.fillRect(7,-1,3,2);
    G.fillRect(-1,-10,2,3); G.fillRect(-1,7,2,3);
  } else if (e.type==='swarmer') {
    G.fillStyle='#fb923c'; G.fillRect(-5,-5,10,10);
    G.fillStyle='#fdba74'; G.fillRect(-2,-2,4,4);
    G.fillStyle='#7c2d12'; G.fillRect(-3,-3,2,2); G.fillRect(1,-3,2,2);
  }
  G.restore();
}

function drawPlayer() {
  const sx=VW/2, sy=player.y;
  const f=player.facing, th=keys['ArrowLeft']||keys['KeyA']||keys['ArrowRight']||keys['KeyD']||keys['ArrowUp']||keys['ArrowDown']||keys['KeyW']||keys['KeyS'];
  G.save(); G.translate(sx,sy); G.scale(f,1);
  // Thruster
  if (th) {
    G.fillStyle=`hsl(${ri(60)},100%,65%)`;
    G.fillRect(-18, -2, 5+Math.random()*8, 4);
  }
  // Body
  G.fillStyle='#38bdf8'; G.fillRect(-14,-4,22,8);
  // Wings
  G.fillStyle='#0ea5e9'; G.fillRect(-14,-7,8,3); G.fillRect(-14,4,8,3);
  // Nose
  G.fillStyle='#bae6fd'; G.fillRect(8,-3,7,6);
  // Cockpit
  G.fillStyle='#1e3a5f'; G.fillRect(5,-2,5,4);
  G.restore();
}

function drawHUD() {
  // Darken top strip
  G.fillStyle='rgba(0,0,0,0.55)'; G.fillRect(0,0,VW,38);

  G.fillStyle='#fff'; G.font='bold 15px monospace'; G.textAlign='left';
  G.fillText(`SCORE: ${score}`, 8, 22);

  // Lives (mini ships)
  const lx0 = VW/2 - lives*16;
  for (let i=0;i<lives;i++) {
    const lx=lx0+i*32;
    G.fillStyle='#38bdf8'; G.fillRect(lx-7,12,14,5); G.fillRect(lx-7,11,5,2); G.fillRect(lx-7,15,5,2);
    G.fillStyle='#bae6fd'; G.fillRect(lx+3,11,4,6);
  }

  G.textAlign='right'; G.font='bold 13px monospace';
  G.fillStyle='#fde047'; G.fillText(`WAVE ${wave}`, VW-8, 16);
  G.fillStyle='#e879f9';
  for (let i=0;i<bombs;i++) { G.fillStyle='#e879f9'; G.fillRect(VW-12-i*14, 20, 8, 8); }
  G.fillStyle='#e879f9'; G.font='10px monospace'; G.fillText('BOMBS', VW-8, 36);
}

function drawScanner() {
  const SX=8, SY=40, SW=VW-16, SH=28;
  G.fillStyle='rgba(0,4,30,0.85)'; G.fillRect(SX,SY,SW,SH);
  G.strokeStyle='#1e3a8a'; G.lineWidth=1; G.strokeRect(SX,SY,SW,SH);

  // Terrain
  G.fillStyle='#14532d';
  for (let i=0;i<terrain.length-1;i++) {
    const tx=SX+(terrain[i][0]/WW)*SW;
    const ty=SY+((terrain[i][1]-(VH-200))/200)*SH;
    G.fillRect(tx,Math.max(SY,ty),2,SH-Math.max(0,ty-SY));
  }

  // Humans
  for (const h of humans) {
    if (!h.alive) continue;
    G.fillStyle='#4ade80';
    G.fillRect(SX+(h.x/WW)*SW-1, SY+SH-6, 2, 5);
  }

  // Enemies
  const ecols={lander:'#f44',mutant:'#a855f7',bomber:'#f97316',pod:'#06b6d4',swarmer:'#fb923c'};
  for (const e of enemies) {
    G.fillStyle=ecols[e.type]||'#f44';
    G.fillRect(SX+(e.x/WW)*SW-1, SY+(e.y/VH)*SH-1, 3,3);
  }

  // Player
  G.fillStyle='#38bdf8';
  G.fillRect(SX+(player.x/WW)*SW-3, SY+SH/2-3, 7,6);

  // Viewport rect
  const vpx=SX+(camX/WW)*SW, vpw=(VW/WW)*SW;
  G.strokeStyle='rgba(255,255,255,0.25)'; G.strokeRect(vpx,SY,vpw,SH);
  if (vpx+vpw>SX+SW) G.strokeRect(SX,SY,vpx+vpw-(SX+SW),SH);
}

function drawTitle() {
  G.fillStyle='rgba(0,0,0,0.72)'; G.fillRect(0,0,VW,VH);
  G.textAlign='center';
  G.fillStyle='#fde047'; G.font='bold 72px monospace'; G.fillText('DEFENDER', VW/2, VH/2-70);
  G.fillStyle='#7dd3fc'; G.font='bold 16px monospace'; G.fillText('PROTECT THE HUMANS FROM ALIEN ABDUCTION', VW/2, VH/2-20);
  G.fillStyle='#d1d5db'; G.font='13px monospace';
  G.fillText('ARROWS — Move   |   Z / SPACE — Fire   |   X / CTRL — Smart Bomb', VW/2, VH/2+20);
  G.fillStyle='#4ade80'; G.font='11px monospace';
  G.fillText('Landers abduct humans → become mutants.  Catch falling humans for bonus!', VW/2, VH/2+48);
  if (Math.floor(Date.now()/500)%2) {
    G.fillStyle='#fde047'; G.font='bold 20px monospace'; G.fillText('PRESS SPACE TO START', VW/2, VH/2+90);
  }
}

function drawGameOver() {
  G.fillStyle='rgba(0,0,0,0.75)'; G.fillRect(0,0,VW,VH);
  G.textAlign='center';
  G.fillStyle='#ef4444'; G.font='bold 60px monospace'; G.fillText('GAME OVER', VW/2, VH/2-50);
  G.fillStyle='#fff'; G.font='22px monospace'; G.fillText(`FINAL SCORE: ${score}`, VW/2, VH/2+10);
  if (Math.floor(Date.now()/500)%2) {
    G.fillStyle='#fde047'; G.font='bold 18px monospace'; G.fillText('PRESS SPACE TO PLAY AGAIN', VW/2, VH/2+60);
  }
}

// ── Loop ──────────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }
genTerrain();
loop();
</script>
</body>
</html>
